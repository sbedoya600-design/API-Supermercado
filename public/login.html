<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión | SUPERMERCADO</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;color:#26352c;background:linear-gradient(135deg,#eaf5ee,#f7faf7)}
.contenedor{width:100%;max-width:420px;background:#fff;padding:36px;border:1px solid #e2eae4;border-radius:18px;box-shadow:0 12px 35px #174d3214}
.marca{text-align:center;margin-bottom:28px}.icono{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 14px;border-radius:16px;background:#176b45;color:white;font-size:28px;font-weight:bold}
h1{margin:0 0 8px;color:#176b45;font-size:27px}.marca p{margin:0;color:#748078;font-size:14px}
label{display:block;margin:18px 0 8px;font-size:14px;font-weight:600}
input{width:100%;padding:13px 14px;border:1px solid #d5e2da;border-radius:8px;font:inherit;outline:none}
input:focus{border-color:#21865b;box-shadow:0 0 0 3px #21865b1f}
button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:8px;background:#176b45;color:white;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:#105b3b}button:disabled{opacity:.65;cursor:wait}
#mensaje{min-height:20px;margin:14px 0 0;font-size:13px;line-height:1.45}#mensaje.error{color:#ad3530}#mensaje.exito{color:#176b45}
.pie{margin-top:24px;text-align:center;font-size:12px;color:#7a887e}
</style>
</head>
<body>
<main class="contenedor">
<header class="marca"><div class="icono">S</div><h1>SUPERMERCADO</h1><p>Sistema de gestión de supermercado</p></header>
<form id="formularioLogin">
<label for="correo">Correo electrónico</label>
<input id="correo" name="correo" type="email" autocomplete="username" placeholder="usuario@ejemplo.com" required>
<label for="contrasena">Contraseña</label>
<input id="contrasena" name="contrasena" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required>
<button id="botonIngresar" type="submit">Iniciar sesión</button>
<p id="mensaje" role="status" aria-live="polite"></p>
</form>
<div class="pie">Acceso exclusivo para usuarios autorizados</div>
</main>
<script>
const API = 'http://localhost:3000';
const formulario = document.getElementById('formularioLogin');
const mensaje = document.getElementById('mensaje');
const boton = document.getElementById('botonIngresar');
formulario.addEventListener('submit', async (evento) => {
  evento.preventDefault(); mensaje.textContent = ''; mensaje.className = '';
  boton.disabled = true; boton.textContent = 'Verificando...';
  const correo = document.getElementById('correo').value.trim().toLowerCase();
  const contrasena = document.getElementById('contrasena').value;
  try {
    const respuesta = await fetch(`${API}/login`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({correo, contrasena})
    });
    const datos = await respuesta.json();
    if (!respuesta.ok || !datos.token) throw new Error(datos.mensaje || 'No fue posible iniciar sesión.');
    sessionStorage.setItem('SUPERMERCADO_token', datos.token);
    if (datos.usuario) sessionStorage.setItem('SUPERMERCADO_usuario', JSON.stringify(datos.usuario));
    mensaje.textContent = 'Inicio de sesión correcto. Abriendo SUPERMERCADO...';
    mensaje.className = 'exito';
    window.location.href = 'index.html';
  } catch (error) {
    mensaje.textContent = error.message || 'No se pudo conectar con el servidor.';
    mensaje.className = 'error';
  } finally { boton.disabled = false; boton.textContent = 'Iniciar sesión'; }
});
</script>
</body>
</html>
